<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13243b"><title>ДелоPay — задания и подработка</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ДелоPay"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#18283d;background:#f1f5fa}*{box-sizing:border-box}body{margin:0}header{background:#13243b;color:white;padding:22px 18px 18px}h1{font-size:26px;margin:0 0 5px}.sub{color:#b8c9df;font-size:13px}.wrap{max-width:640px;margin:auto}.tabs{display:flex;gap:8px;padding:14px 16px}.tabs button{flex:1}.btn,button{border:0;border-radius:12px;padding:12px 14px;font-weight:650;background:#e2eaf4;color:#17324f;cursor:pointer}.primary{background:#1677eb;color:white}.active{background:#1677eb;color:white}.content{padding:0 16px 90px}.card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 9px #1a3d6610}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#eaf2ff;color:#2864a7;font-size:12px}.money{font-size:21px;font-weight:800;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.filters{display:flex;gap:8px;margin:10px 0}.filters button{flex:1;font-size:12px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;margin:5px 0 13px;background:white}label{font-size:13px;font-weight:600}textarea{min-height:80px}h2{font-size:19px}small{color:#64748b}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e8f0;display:flex;justify-content:center;padding:9px 10px calc(9px + env(safe-area-inset-bottom))}.bottom .inner{width:100%;max-width:640px;display:flex;gap:8px}.bottom button{flex:1;font-size:12px;padding:10px 5px} .notice{background:#fff7e7;color:#795400;border-radius:12px;padding:11px;font-size:12px;margin:10px 0}.empty{padding:28px;text-align:center;color:#64748b}.stat{background:#eaf2ff;border-radius:14px;padding:14px;margin-bottom:12px}</style></head><body><div class="wrap"><header><h1>ДелоPay <span style="font-size:12px;opacity:.75">0.3</span></h1><div class="sub">Задания онлайн и рядом · демонстрация</div></header><div class="tabs"><button id="worker" onclick="setRole('worker')">👷 Исполнитель</button><button id="client" onclick="setRole('client')">🧑‍💼 Заказчик</button></div><main class="content" id="app"></main></div><nav class="bottom"><div class="inner"><button onclick="setPage('home')">🏠 Главная</button><button onclick="setPage('orders')">📋 Мои заказы</button><button onclick="setPage('profile')">👤 Профиль</button></div></nav><script>
const key='delopay03';const sample=[{id:1,title:'Набрать текст с фотографии',desc:'Перенести текст в документ, около 3 страниц.',price:500,kind:'online',city:'Вся Россия',status:'open',applicants:[],worker:null,owner:'Демо-заказчик'},{id:2,title:'Создать баннер для магазина',desc:'Один рекламный баннер для соцсетей.',price:1500,kind:'online',city:'Вся Россия',status:'open',applicants:[],worker:null,owner:'Демо-заказчик'},{id:3,title:'Помочь собрать стеллаж',desc:'Сборка небольшого стеллажа, инструменты у исполнителя.',price:2000,kind:'local',city:'Москва',status:'open',applicants:[],worker:null,owner:'Демо-заказчик'}];let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!Array.isArray(state.jobs))state={jobs:sample,role:'worker',page:'home',filter:'all',name:'Пользователь',nextId:4};function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rub(x){return Number(x).toLocaleString('ru-RU')+' ₽'}function setRole(v){state.role=v;state.page='home';save();render()}function setPage(v){state.page=v;save();render()}function setFilter(v){state.filter=v;save();render()}function isOwner(j){return j.owner==='Я'}function jobCard(j){let worker=state.role==='worker',owned=isOwner(j),applied=j.applicants.includes('Я');let status={open:'Открыто',assigned:'В работе',submitted:'На проверке',done:'Завершено'}[j.status];let buttons='';if(worker&&j.status==='open'&&!owned)buttons=`<button class="primary" onclick="apply(${j.id})" ${applied?'disabled':''}>${applied?'Отклик отправлен':'Откликнуться'}</button>`;if(worker&&j.worker==='Я'&&j.status==='assigned')buttons=`<button class="primary" onclick="submitWork(${j.id})">Сдать работу</button>`;if(!worker&&owned&&j.status==='open'&&j.applicants.length)buttons=`<button class="primary" onclick="assign(${j.id})">Выбрать исполнителя (${j.applicants.length})</button>`;if(!worker&&owned&&j.status==='submitted')buttons=`<button class="primary" onclick="finish(${j.id})">Подтвердить выполнение</button>`;return `<div class="card"><div class="row"><span class="pill">${j.kind==='online'?'🌐 Онлайн':'📍 Местная услуга'}</span><small>${status}</small></div><h2>${esc(j.title)}</h2><p class="muted">${esc(j.desc)}</p><div class="muted">📍 ${esc(j.city)}</div><div class="money">${rub(j.price)}</div><div class="muted">Исполнителю после комиссии 15%: ${rub(Math.round(j.price*.85))}</div><div style="margin-top:14px">${buttons}</div></div>`}function apply(id){let j=state.jobs.find(j=>j.id===id);if(j&&j.status==='open'&&!j.applicants.includes('Я')){j.applicants.push('Я');save();render()}}function assign(id){let j=state.jobs.find(j=>j.id===id);if(j&&isOwner(j)&&j.status==='open'&&j.applicants.length){j.worker=j.applicants[0];j.status='assigned';save();render()}}function submitWork(id){let j=state.jobs.find(j=>j.id===id);if(j&&j.worker==='Я'&&j.status==='assigned'){j.status='submitted';save();render()}}function finish(id){let j=state.jobs.find(j=>j.id===id);if(j&&isOwner(j)&&j.status==='submitted'){j.status='done';save();render()}}function createJob(e){e.preventDefault();let f=new FormData(e.target);let price=Number(f.get('price'));if(!Number.isFinite(price)||price<100||price>1000000){alert('Укажите цену от 100 до 1 000 000 ₽');return}state.jobs.unshift({id:state.nextId++,title:String(f.get('title')).trim().slice(0,100),desc:String(f.get('desc')).trim().slice(0,500),price,kind:f.get('kind'),city:String(f.get('city')).trim().slice(0,80),status:'open',applicants:[],worker:null,owner:'Я'});save();render()}function render(){document.getElementById('worker').className=state.role==='worker'?'active':'';document.getElementById('client').className=state.role==='client'?'active':'';let el=document.getElementById('app'),s='<div class="notice">Учебный прототип. Задания и суммы демонстрационные. Настоящих пользователей, платежей и гарантированного заработка нет.</div>';if(state.page==='profile'){s+=`<div class="card"><h2>Профиль</h2><p>Роль: ${state.role==='worker'?'Исполнитель':'Заказчик'}</p><p class="muted">Данные хранятся только в браузере этого устройства.</p><button onclick="if(confirm('Удалить все локальные данные?')){localStorage.removeItem(key);location.reload()}">Сбросить демо-данные</button></div>`}else if(state.page==='orders'){let jobs=state.jobs.filter(j=>state.role==='worker'?(j.applicants.includes('Я')||j.worker==='Я'):isOwner(j));let earned=state.jobs.filter(j=>j.worker==='Я'&&j.status==='done').reduce((a,j)=>a+Math.round(j.price*.85),0);if(state.role==='worker')s+=`<div class="stat"><small>Демонстрационный заработок по завершённым заданиям</small><div class="money">${rub(earned)}</div></div>`;s+='<h2>Мои заказы</h2>'+(jobs.length?jobs.map(jobCard).join(''):'<div class="empty">Пока нет заказов</div>')}else if(state.role==='worker'){let jobs=state.jobs.filter(j=>j.status==='open'&&(state.filter==='all'||j.kind===state.filter));s+='<h2>Найти задание</h2><div class="filters">'+[['all','Все'],['online','Онлайн'],['local','Рядом / города']].map(([v,t])=>`<button class="${state.filter===v?'active':''}" onclick="setFilter('${v}')">${t}</button>`).join('')+'</div>'+(jobs.length?jobs.map(jobCard).join(''):'<div class="empty">Нет доступных заданий</div>')}else{s+=`<h2>Опубликовать задание</h2><form class="card" onsubmit="createJob(event)"><label>Название</label><input name="title" required maxlength="100" placeholder="Например, сделать презентацию"><label>Описание</label><textarea name="desc" required maxlength="500" placeholder="Что именно нужно сделать?"></textarea><label>Стоимость, ₽</label><input name="price" type="number" min="100" max="1000000" required placeholder="1000"><label>Тип задания</label><select name="kind"><option value="online">Онлайн</option><option value="local">Местная услуга</option></select><label>Город или регион</label><input name="city" required maxlength="80" placeholder="Москва или Вся Россия"><button class="primary" type="submit">Разместить задание</button></form><h2>Мои объявления</h2>`;let jobs=state.jobs.filter(isOwner);s+=jobs.length?jobs.map(jobCard).join(''):'<div class="empty">Пока нет опубликованных заданий</div>'}el.innerHTML=s}render();
</script><script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));}</script></body></html>
